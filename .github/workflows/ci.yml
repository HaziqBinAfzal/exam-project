name: Exam Project CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run Python unit tests
        run: python -B -m unittest discover -v

      - name: Check Bash scripts
        run: |
          for script in ./*.sh; do
            bash -n "$script" || exit 1
          done

      - name: Check Fabric chaincode syntax
        run: node --check chaincode/carbon-credits/index.js

      - name: Scan Git history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact /repo

      - name: Audit locked Fabric dependencies
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/chaincode/carbon-credits:/app:ro" -w /app \
            node@sha256:be979e5523c76fa4d5ca4ebd3099078f220aa47ec39c48ad5b5df9314debd6eb \
            npm audit --omit=dev --audit-level=high --cache /tmp/npm-cache

      - name: Test Fabric contract behavior
        working-directory: chaincode/carbon-credits
        run: |
          npm ci --ignore-scripts --no-audit
          node --test index.test.js
